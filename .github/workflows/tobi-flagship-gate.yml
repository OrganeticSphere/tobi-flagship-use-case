name: Tobi Flagship Use Case

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pr-gate:
    name: PR gate - valid artifact must pass
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show repository gate contract
        shell: pwsh
        run: Get-Content .\policy\stage1_gate_contract.md

      - name: Run Tobi Validator action in canon mode
        uses: OrganeticSphere/tobi-validator@v2
        with:
          version: stage1-tobi-validator-v0.7.0
          mode: canon
          canon_input: agent_artifacts/merge_token_valid.tsubasa

  validation-evidence:
    name: Validation evidence - canon, _h, drift, reject
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up public Tobi Validator and check valid artifact
        uses: OrganeticSphere/tobi-validator@v2
        with:
          mode: canon
          canon_input: agent_artifacts/merge_token_valid.tsubasa

      - name: Validate canonical output for valid artifact
        shell: pwsh
        run: |
          $path = (Resolve-Path ".\agent_artifacts\merge_token_valid.tsubasa").Path
          $out = & "$env:TOBI_EXE_PATH" canon $path 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0) {
            throw "Expected valid artifact to pass canon, but it failed.`n$out"
          }

          if ($out -notmatch "CANON:\s*(?<canon>.+?)\s*HASH:\s*(?<hash>[a-f0-9]+)\s*$" ) {
            throw "Could not parse canon/hash output for valid artifact.`n$out"
          }

          $canon = $Matches["canon"].Trim()
          $hash = $Matches["hash"].Trim().ToLowerInvariant()

          $expectedCanon = (Get-Content ".\expected_outputs\merge_token_valid.canon.txt" -Raw).Trim()
          $expectedHash = (Get-Content ".\expected_outputs\merge_token_valid.hash.txt" -Raw).Trim().ToLowerInvariant()

          if ($canon -ne $expectedCanon) {
            throw "Canonical output mismatch for valid artifact. Expected '$expectedCanon' but got '$canon'."
          }

          if ($hash -ne $expectedHash) {
            throw "Hash mismatch for valid artifact. Expected '$expectedHash' but got '$hash'."
          }

          Set-Content ".\valid_output.txt" $out

      - name: Validate convergence for drift-equivalent artifact
        shell: pwsh
        run: |
          $path = (Resolve-Path ".\agent_artifacts\merge_token_drift_equivalent.tsubasa").Path
          $out = & "$env:TOBI_EXE_PATH" canon $path 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0) {
            throw "Expected drift-equivalent artifact to pass canon, but it failed.`n$out"
          }

          if ($out -notmatch "CANON:\s*(?<canon>.+?)\s*HASH:\s*(?<hash>[a-f0-9]+)\s*$" ) {
            throw "Could not parse canon/hash output for drift-equivalent artifact.`n$out"
          }

          $canon = $Matches["canon"].Trim()
          $hash = $Matches["hash"].Trim().ToLowerInvariant()

          $expectedCanon = (Get-Content ".\expected_outputs\merge_token_drift_equivalent.canon.txt" -Raw).Trim()
          $expectedHash = (Get-Content ".\expected_outputs\merge_token_drift_equivalent.hash.txt" -Raw).Trim().ToLowerInvariant()

          if ($canon -ne $expectedCanon) {
            throw "Canonical output mismatch for drift-equivalent artifact. Expected '$expectedCanon' but got '$canon'."
          }

          if ($hash -ne $expectedHash) {
            throw "Hash mismatch for drift-equivalent artifact. Expected '$expectedHash' but got '$hash'."
          }

          Set-Content ".\drift_equivalent_output.txt" $out

      - name: Validate reject behavior for invalid artifact
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $path = (Resolve-Path ".\agent_artifacts\merge_token_invalid.tsubasa").Path
          $out = & "$env:TOBI_EXE_PATH" canon $path 2>&1 | Out-String
          if ($LASTEXITCODE -eq 0) {
            throw "Expected invalid artifact to fail canon, but it passed.`n$out"
          }

          $expectedError = (Get-Content ".\expected_outputs\merge_token_invalid.error.txt" -Raw).Trim()
          if ($out -notmatch [regex]::Escape($expectedError)) {
            throw "Expected invalid artifact to contain '$expectedError'. Actual output:`n$out"
          }

          Set-Content ".\invalid_output.txt" $out
          exit 0

      - name: Upload validation evidence
        uses: actions/upload-artifact@v4
        with:
          name: tobi-flagship-evidence
          path: |
            valid_output.txt
            drift_equivalent_output.txt
            invalid_output.txt
